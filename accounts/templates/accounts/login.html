
{% extends "_base.html" %}

{% block page_title %}
    login
{% endblock page_title %}

{% block content %}
    <form action="" method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">login</button>
    </form>
    {% if user.is_authenticated %}
        <a href="{% url 'accounts:change_password'  %}">change password</a>
    {% else %}  
        <a href="{% url 'accounts:forgot_password'  %}">forgat password</a>
    {% endif %}
{% endblock content %}
